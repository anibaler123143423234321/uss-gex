<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none">
  <!-- Círculos concéntricos del sello -->
  <circle cx="120" cy="120" r="110" stroke="#059669" stroke-width="3" stroke-dasharray="6 4" opacity="0.35"/>
  <circle cx="120" cy="120" r="102" stroke="#059669" stroke-width="2" opacity="0.5"/>
  <circle cx="120" cy="120" r="76" stroke="#059669" stroke-width="1.5" opacity="0.4"/>

  <!-- Corona de Laureles alrededor -->
  <g stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" fill="none">
    <!-- Laurel Izquierdo -->
    <path d="M72 165 C 50 145, 50 95, 75 75" />
    <path d="M70 155 c-5-4-8-12-3-16 4 2 6 8 3 16z" fill="#10b981" fill-opacity="0.15"/>
    <path d="M63 138 c-6-3-10-10-6-15 4 2 7 8 2 15z" fill="#10b981" fill-opacity="0.15"/>
    <path d="M60 120 c-6-2-11-8-8-14 4 1 8 6 4 14z" fill="#10b981" fill-opacity="0.15"/>
    <path d="M62 102 c-5-1-10-6-8-12 4 1 8 5 4 12z" fill="#10b981" fill-opacity="0.15"/>
    <path d="M68 85 c-4 0-8-5-6-10 4 1 7 4 2 10z" fill="#10b981" fill-opacity="0.15"/>

    <!-- Laurel Derecho -->
    <path d="M168 165 C 190 145, 190 95, 165 75" />
    <path d="M170 155 c5-4 8-12 3-16-4 2-6 8-3 16z" fill="#10b981" fill-opacity="0.15"/>
    <path d="M177 138 c6-3 10-10 6-15-4 2-7 8-2 15z" fill="#10b981" fill-opacity="0.15"/>
    <path d="M180 120 c6-2 11-8 8-14-4 1-8 6-4 14z" fill="#10b981" fill-opacity="0.15"/>
    <path d="M178 102 c5-1 10-6 8-12-4 1-8 5-4 12z" fill="#10b981" fill-opacity="0.15"/>
    <path d="M172 85 c4 0 8-5 6-10-4 1-7 4-2 10z" fill="#10b981" fill-opacity="0.15"/>
  </g>

  <!-- Birrete central (Graduation Cap) -->
  <g transform="translate(85, 78)" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75">
    <polygon points="35 6 65 20 35 34 5 20 35 6" fill="#10b981" fill-opacity="0.25"/>
    <path d="M14 26v12c0 8 9.5 15 21 15s21-7 21-15v-12" fill="#059669" fill-opacity="0.12"/>
    <path d="M65 20v22" />
    <circle cx="65" cy="44" r="3" fill="#059669"/>
  </g>

  <!-- Cinta inferior de Acreditación -->
  <g transform="translate(60, 168)" opacity="0.8">
    <path d="M10 5 L110 5 L120 18 L110 30 L10 30 L20 18 Z" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="2" stroke-linejoin="round"/>
    <text x="60" y="21" fill="#059669" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" text-anchor="middle">ACREDITADO</text>
  </g>

  <!-- Estrellas de excelencia académica -->
  <g fill="#059669" opacity="0.6">
    <polygon points="120,44 122,50 128,50 123,54 125,60 120,56 115,60 117,54 112,50 118,50" transform="scale(0.8) translate(30, 8)"/>
    <polygon points="100,52 101,57 106,57 102,60 104,65 100,62 96,65 98,60 94,57 99,57" transform="scale(0.8) translate(25, 12)"/>
    <polygon points="140,52 141,57 146,57 142,60 144,65 140,62 136,65 138,60 134,57 139,57" transform="scale(0.8) translate(35, 12)"/>
  </g>
</svg>
